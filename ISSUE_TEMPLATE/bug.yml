name: Bug
description: Report something that is not working
title: ""
labels: ["type:bug"]

body:
  - type: textarea
    id: problem
    attributes:
      label: What is happening?
      description: Briefly describe the problem.
      placeholder: When..., the system...
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: List the steps if known.
      placeholder: |
        1. ...
        2. ...
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Notes
      description: Expected behavior, screenshots, logs, or other useful context.
      placeholder: |
        Add screenshots, logs, or other useful context here.
    validations:
      required: false
